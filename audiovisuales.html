            // Variables de estado
            var currentCategory = 'todos';
            var currentPage = 1;
            var itemsPerPage = 6; 
            var eventosArray = []; 
            var filteredData = [];

            // 2. Utilidad: Quitar acentos para que la búsqueda sea exacta
            function removeAccents(str) {
              return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            }

            function agruparPorEvento() {
                var agrupados = {};
                
                jsonData.forEach(function(item) {
                    // Usamos CategoriaEvento como clave única. Si no tiene, lo mandamos a "otros"
                    var clave = item.CategoriaEvento || "otros";
                    
                    if (!agrupados[clave]) {
                        agrupados[clave] = {
                            CategoriaEvento: clave,
                            Evento: item.Categoria || "Evento sin nombre",
                            Videos: []
                        };
                    }
                    agrupados[clave].Videos.push(item);
                });
                
                eventosArray = Object.values(agrupados);
            }

            // 3. Contadores para los botones
            function updateCounts() {
                $('#count-todos').text(eventosArray.length);
                
                // Ahora contamos cuántos *grupos de eventos* existen para cada categoría
                $('#count-filtro01').text(eventosArray.filter(g => g.CategoriaEvento === 'memoriaForos').length);
                $('#count-filtro02').text(eventosArray.filter(g => g.CategoriaEvento === 'comitesdepaz').length);
                $('#count-filtro03').text(eventosArray.filter(g => g.CategoriaEvento === 'estrategiasAula').length);
            }

            // 4. Renderizar las Tarjetas (Solo la página actual)
            function processData() {
        var searchTerm = removeAccents($('#searchInput').val().toLowerCase());

        filteredData = eventosArray.filter(function(grupo) {
            // A. Filtro por los botones (Forzamos 'todos' a minúsculas por seguridad)
            var categoriaSeleccionada = currentCategory.toLowerCase();
            var matchesCategory = (categoriaSeleccionada === 'todos') || (grupo.CategoriaEvento === currentCategory);
            
            // B. Filtro por la barra de búsqueda
            var itemNombre = removeAccents(grupo.Evento.toLowerCase());
            var matchesSearch = itemNombre.includes(searchTerm);
            
            return matchesCategory && matchesSearch;
        });

        // Configuración de Paginación
        var totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages || 1; 
        
        var startIndex = (currentPage - 1) * itemsPerPage;
        var paginatedData = filteredData.slice(startIndex, startIndex + itemsPerPage);

        renderResults(paginatedData);
        renderPagination(filteredData.length);
    }

            function renderResults(data) {
                var container = $('#resultsContainer');
                container.empty();

                if (data.length === 0) {
                    container.append('<div class="col-xs-12 text-center"><h4>No se encontraron eventos.</h4></div>');
                    return;
                }

                $.each(data, function(index, eventoGrupo) {
                    var primerVideo = eventoGrupo.Videos[0];
                    var totalVideos = eventoGrupo.Videos.length;

                    var html = `
                        <div class="col-sm-6 col-md-4">
                            <div class="recurso-card">
                                <span class="badge-videos-count">${totalVideos} videos</span>
                                
                                <div class="video-icon-placeholder">
                                    <i class="glyphicon glyphicon-play" style="font-size: 60px; color: white; opacity: 0.9;"></i>
                                </div>
                                
                                <h4 class="recurso-titulo" style="min-height: 40px; margin-bottom: 20px;">${eventoGrupo.Evento}</h4>
                                
                                <button class="btn btn-ver btn-block btn-abrir-modal" 
                                        data-url="${primerVideo.Url}" 
                                        data-tipo="${primerVideo.Tipo_material || 'video'}"
                                        data-titulo="${primerVideo.Nombre}"
                                        data-descripcion="${primerVideo.Descripcion || ''}"
                                        data-evento="${eventoGrupo.CategoriaEvento}"
                                        data-id="${primerVideo.Id}">
                                  <i class="glyphicon glyphicon-play"></i> Ver
                                </button>
                            </div>
                        </div>
                    `;
                    container.append(html);
                });
            }

            // 5. Renderizar los botones de Paginación
            function renderPagination(totalItems) {
                var pagination = $('#paginationContainer');
                pagination.empty();

                var totalPages = Math.ceil(totalItems / itemsPerPage);

                if (totalPages <= 1) return;

                var prevClass = (currentPage === 1) ? 'disabled' : '';
                pagination.append(`<li class="${prevClass}"><a href="#" data-page="prev">&laquo;</a></li>`);

                for (var i = 1; i <= totalPages; i++) {
                    var activeClass = (currentPage === i) ? 'active' : '';
                    pagination.append(`<li class="${activeClass}"><a href="#" data-page="${i}">${i}</a></li>`);
                }

                var nextClass = (currentPage === totalPages) ? 'disabled' : '';
                pagination.append(`<li class="${nextClass}"><a href="#" data-page="next">&raquo;</a></li>`);
            }

            

            

            // Lógica de filtrado
            function filterData() {
              var searchTerm = $('#searchInput').val().toLowerCase();

              var filteredData = jsonData.filter(function (item) {
                // 1. CORRECCIÓN OCULTA: Usar item.Categoria (con 'C' mayúscula igual que en tu JSON)
                var matchesCategory = (currentCategory === 'todos') || (item.CategoriaEvento === currentCategory);

                // 2. CORRECCIÓN DEL ERROR NULL: Si item.Nombre es null/undefined, usamos "" (texto vacío)
                var nombreSeguro = item.Nombre || "";
                var matchesSearch = nombreSeguro.toLowerCase().includes(searchTerm);

                return matchesCategory && matchesSearch;
              });

              console.log("filteredData", filteredData);
              renderResults(filteredData);
            }

            // --- EVENTOS DEL BUSCADOR Y FILTROS ---
           $('#searchInput').on('keyup', function() { 
              currentPage = 1; 
              processData(); 
          });
    




            $('#searchBtn').on('click', function () { filterData(); });
            

            // Búsqueda (Al escribir, reiniciamos a la página 1)
            $('#searchInput').on('keyup', function () {
              currentPage = 1;
              processData();
            });

            // Filtro por Categoría
            $('.filter-btn').on('click', function() {
        $('.filter-btn').removeClass('active');
        $(this).addClass('active');
        
        // Obtenemos el valor exacto del data-filter (ej. "todos" o "foroCOLBACH")
        currentCategory = $(this).attr('data-filter'); 
        currentPage = 1; 
        processData();
    });
            // Clic en la Paginación
            $('#paginationContainer').on('click', 'a', function (e) {
                e.preventDefault();
                var targetPage = $(this).attr('data-page');
                var totalPages = Math.ceil(filteredData.length / itemsPerPage);

                if (targetPage === 'prev' && currentPage > 1) {
                    currentPage--;
                } else if (targetPage === 'next' && currentPage < totalPages) {
                    currentPage++;
                } else if (targetPage !== 'prev' && targetPage !== 'next') {
                    currentPage = parseInt(targetPage);
                }
                processData();
            });


            // --- LÓGICA DEL MODAL ---

            function obtenerUrlEmbedYouTube(url) {
              var videoId = "";
              // Limpiamos espacios en blanco por si acaso en el JSON hay espacios al final
              url = url.trim();

              // Si es formato corto: youtu.be/ID
              if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
              }
              // Si es formato largo: youtube.com/watch?v=ID
              else if (url.includes("youtube.com/watch")) {
                var urlParams = new URLSearchParams(url.split("?")[1]);
                videoId = urlParams.get("v");
              }

              // Devolvemos el enlace con autoplay activado
              if (videoId) {
                return "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
              }
              return url; // Si no lo reconoce, devuelve el original
            }

            window.copiarUrl = function (url) {
              navigator.clipboard.writeText(url).then(function () {
                alert("¡Enlace copiado! Ya puedes pegarlo donde quieras.");
              }).catch(function (err) {
                console.error('Error al copiar: ', err);
                alert("Tu navegador no soporta copiar automáticamente. El enlace es: " + url);
              });
            };

            // Usamos delegación de eventos porque los botones se generan dinámicamente
            //$('#resultsContainer').on('click', '.btn-abrir-modal', function () {
            $(document).on('click', '.btn-abrir-modal', function () {
              // Obtenemos los datos del botón que se hizo clic
              var url = $(this).data('url');
              var tipo = $(this).data('tipo');
              var titulo = $(this).data('titulo');
              var descripcion = $(this).data('descripcion');
              var evento = $(this).data('evento');
              var currentId = $(this).data('id');
              //console.log("url", url);
              

              // Actualizamos el título del modal
              $('#recursoModalLabel').text(titulo);

              var visor = $('#visorContenido');
              visor.empty(); // Limpiamos lo que hubiera antes

              // Inyectamos el HTML correcto según el tipo de archivo
              if (tipo === 'imagen') {
                visor.append('<img src="' + url + '" class="img-responsive" style="margin: 0 auto; max-height: 70vh; border-radius: 10px;">');
              }
              else if (tipo === 'pdf') {
                // Usamos un iframe para embeber el PDF
                visor.append('<iframe src="' + url + '" width="100%" height="500px" style="border: none; border-radius: 10px;"></iframe>');
              }
              else if (tipo === 'video') {
                var embedUrl = obtenerUrlEmbedYouTube(url);

                // --- LÓGICA DE RECOMENDACIONES ---
                var listaRecomendacionesHTML = "";

                if (evento) {
                  // Filtramos el JSON buscando videos del mismo evento, excluyendo el actual
                  var videosRelacionados = jsonData.filter(function (item) {
                    return item.CategoriaEvento === evento && item.Id !== currentId && item.Tipo_material === 'video';
                  });

                  // Tomamos un máximo de 5 videos
                  var top5Recomendados = videosRelacionados.slice(0, 100);

                  if (top5Recomendados.length > 0) {
                    $.each(top5Recomendados, function (index, rec) {
                      listaRecomendacionesHTML += `
                            <div class="recomendacion-item">
                                <div class="recomendacion-nombre">${rec.Nombre}</div>
                                <button class="btn btn-ver-recomendacion btn-abrir-modal" 
                                        data-url="${rec.Url}" 
                                        data-tipo="video"
                                        data-titulo="${rec.Nombre}"
                                        data-descripcion="${rec.Descripcion || ''}"
                                        data-evento="${rec.CategoriaEvento}"
                                        data-id="${rec.Id}">
                                    Ver video
                                </button>
                            </div>
                        `;
                    });
                  } else {
                    listaRecomendacionesHTML = "<p class='text-muted' style='font-size:12px;'>No hay más videos de este evento.</p>";
                  }
                } else {
                  listaRecomendacionesHTML = "<p class='text-muted' style='font-size:12px;'>No hay eventos relacionados.</p>";
                }

                // --- CONSTRUCCIÓN DEL HTML FINAL (Grid: 8 y 4) ---
                var contenidoModal = `
                <div class="row">
                    <div class="col-xs-12 col-md-8">
                        <div class="embed-responsive embed-responsive-16by9" style="border-radius: 10px; overflow: hidden; background-color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                            <iframe class="embed-responsive-item" src="${embedUrl}" allowfullscreen allow="autoplay"></iframe>
                        </div>
                        
                        <div class="modal-info-container" style="text-align: left; padding: 25px 0 10px 0;">
                            <h2 class="modal-titulo-recurso" style="margin-top:0;">${titulo}</h2>
                            <div class="modal-badges">
                                <span class="badge-video">VIDEO</span>
                                <span class="badge-categoria">${evento}</span>
                            </div>
                            <p class="modal-descripcion">${descripcion}</p>
                            <div class="modal-botones">
                                <button class="btn btn-compartir" onclick="copiarUrl('${url}')">
                                    Compartir <i class="glyphicon glyphicon-share" style="margin-left:5px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-xs-12 col-md-4">
                        <div style="background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 100%; text-align: left;">
                            <h4 class="recomendaciones-titulo">Más de este evento</h4>
                            <div style="max-height: 450px; overflow-y: auto; padding-right: 5px;">
                                ${listaRecomendacionesHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

                visor.append(contenidoModal);
              }
              else {
                visor.append('<p class="text-danger">Formato no soportado.</p>');
              }

              // Finalmente, mostramos el modal
              $('#recursoModal').modal('show');
              $('#recursoModal').animate({ scrollTop: 0 }, 300);
            });

            // IMPORTANTE: Limpiar el modal al cerrarlo (evita que el video/audio siga sonando en el fondo)
            $('#recursoModal').on('hidden.bs.modal', function () {
              $('#visorContenido').empty();
            });

            // Inicializar
            agruparPorEvento(); 
            updateCounts();     
            processData();
          });

        </script>
