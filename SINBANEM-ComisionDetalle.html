        <script>
          $(document).ready(function () {

              var jsonData = [
  {
    "id": "1",
    "titulo": "Comisión de Trabajo sobre Reglas y Lineamientos de Registro Escolar y Portabilidad de Estudios",
    "descripcion_corta": "Garantizar la permanencia en el sistema escolar de Educación Media Superior, la portabilidad de los estudios, la continuidad de las trayectorias escolares y prevenir la desafiliación",
    "objetivo": "",
    "archivo": "assets/SINBANEM/comisiones/comision.png",
    "estatus": "publico",
    "integrantes": "Presidenta del SINBANEM, Subsecretario de Educación Media Superior del Estado de México, Subsecretario de Educación Media Superior del Estado de Jalisco, Directora de Educación Media Superior y Superior en el Estado de Tlaxcala, Subsecretaria de Educación Media Superior y Superior del Estado de Guerrero, Subsecretario de Educación Media Superior y Superior del Estado de Hidalgo, Coordinadora de Educación Media Superior y Formación para el Trabajo en el Estado de Querétaro y Subsecretaria de Educación Ciencia, Tecnología e Innovación de la Ciudad de México. ",
    "ayo": "2025-2026"
  },
  {
    "id": "2",
    "titulo": "Comisión de Trabajo sobre Indicadores Educativos",
    "descripcion_corta": "Revisar los indicadores de Educación Media Superior",
    "objetivo": "",
    "archivo": "assets/SINBANEM/comisiones/comision.png",
    "estatus": "publico",
    "integrantes": "Presidente del SINBANEM, Subsecretaria de Educación Media Superior del Estado de Nuevo León, Subsecretario de Educación Media Superior del Estado de México, Subsecretario de Educación Media Superior del Estado de Jalisco y Subsecretario de Educación Media Superior del Estado de Oaxaca",
    "ayo": "2025-2026"
  }
];

              function getParam(name) {
                var params = new URLSearchParams(window.location.search);
                return params.get(name);
              }

              function escapeHtml(text) {
                return String(text || '')
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#039;');
              }

              function renderNotFound() {
                $('#detalleComisionContainer').html(`
      <div class="detalle-comision-empty">
        <h3>No se encontró la comisión</h3>
        <p>Verifica el id en la URL o regresa al listado.</p>
      </div>
    `);
              }

              function renderDetalle(item) {
                var html = `
      <div class="detalle-comision-wrap">
        <div class="detalle-comision-grid">
          
          <div class="detalle-comision-media">
            <img src="${escapeHtml(item.archivo || 'assets/SINBANEM/comisiones/comision.png')}" alt="${escapeHtml(item.titulo)}">
          </div>

          <div class="detalle-comision-info">
            <h1 class="detalle-comision-titulo">${escapeHtml(item.titulo || 'Sin título')}</h1>
            <div class="detalle-comision-linea"></div>

            <div class="detalle-comision-meta">
              <div class="detalle-comision-meta-item">
                <i class="glyphicon glyphicon-user"></i>
                <span>${escapeHtml(item.integrantes || 'Integrantes')}</span>
              </div>

              <div class="detalle-comision-meta-item">
                <i class="glyphicon glyphicon-globe"></i>
                <span>${escapeHtml(item.estatus || 'Sin estatus')}</span>
              </div>

              <div class="detalle-comision-meta-item">
                <i class="glyphicon glyphicon-calendar"></i>
                <span>${escapeHtml(item.ayo || '')}</span>
              </div>
            </div>

            <h2 class="detalle-comision-subtitulo">Objetivo de la comisión</h2>
            <div class="detalle-comision-objetivo">
              ${escapeHtml(item.objetivo || item.descripcion_corta || 'Sin información disponible.')}
            </div>
          </div>

        </div>
      </div>
    `;

                $('#detalleComisionContainer').html(html);
              }

              function initDetalle() {
                var id = getParam('id');

                if (!id) {
                  renderNotFound();
                  return;
                }

                var item = jsonData.find(function (el) {
                  return String(el.id) === String(id);
                });

                if (!item) {
                  renderNotFound();
                  return;
                }

                renderDetalle(item);
              }

              initDetalle();
            });
          </script>

        </script>
