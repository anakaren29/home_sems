        <script>
          $(document).ready(function () {

            var baseMateriales = '/assets/SINBANEM/sesiones/materiales/';

            var jsonData = [
                          {
                "id": "1",
                "titulo": "Primera Sesión Extraordinaria 2026",
                "descripcion_corta": "Primera Sesión Extraordinaria2026 del Consejo del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana.",
                "descripcion": "Primera Sesión Extraordinaria de 2026 del Consejo Nacional del SINBANEM. En la sesión se votó el calendario de sesiones ordinarias del 2026 y se mencionaron los temasque serán prioritarios para este año.",
                "fecha": "Viernes 16 de enero de 2026",
                "modalidad": "Virtual",
                "relacionados": "2,3",
                "file_ordenDia": "orden del día-01.pdf",
                "file_presentacion": "Presentación final-01.pptx",
                "file_acta": "Presentación final-01.pptx",
                "file_minuta": "Presentación final-01.pptx",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "2",
                "titulo": "Primera Sesión Ordinaria 2026",
                "descripcion_corta": "Primera Sesión Ordinaria 2026del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana",
                "descripcion": "Primera Sesión Ordinaria de 2026.\nEn la Sesión se votó un punto de acuerdo para añadir a los Lineamientos Generales la obligatoriedad de firmar las actas de las sesiones de manera electrónica. \nSe presentaron avances de la Comisión de Trabajo sobre Reglas y Lineamientos de Registro Escolar y Portabilidad de Estudios. \nSe presentó un Informe de Indicadores de cobertura, \nasí como el tema de los Juegos escolares y Política de copas de futbol estudiantil. ",
                "fecha": "Jueves 22 de enero de 2026",
                "modalidad": "Virtual",
                "relacionados": "1,3",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "3",
                "titulo": "Segunda Sesión Extraordinaria 2026",
                "descripcion_corta": "Segunda Sesión Extraordinaria de 2026 del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana.",
                "descripcion": "Segunda Sesión Extraordinaria 2026.En esta sesión se presentó el Informe de avances de los Mecanismos de ingreso a la Educación Media Superior (Acuerdo SINBANEM_04_17/10/25) y se votó un Punto de Acuerdo para la implementación obligatoria de procesos estatales centralizados de registro y asignación a la Educación Media Superior, orientados a garantizar el acceso universal y el ejercicio efectivo del derecho a la educación. ",
                "fecha": "Jueves 29 de enero de 2026",
                "modalidad": "Presencial",
                "relacionados": "1,2",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "4",
                "titulo": "Segunda Sesión Ordinaria 2026",
                "descripcion_corta": "Segunda Sesión Ordinaria 2026 del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana",
                "descripcion": "",
                "fecha": "Jueves 26 de marzo de 2026",
                "modalidad": "Virtual",
                "relacionados": "",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              }
            ];

            function obtenerIdURL() {
              var params = new URLSearchParams(window.location.search);
              return params.get('id');
            }

            function buscarItemPorId(idBuscado) {
              return jsonData.find(function (item) {
                return String(item.id) === String(idBuscado);
              });
            }

            function normalizarRutaArchivo(valor) {
              if (!valor || !String(valor).trim()) return '';

              valor = String(valor).trim();

              if (/^https?:\/\//i.test(valor) || valor.charAt(0) === '/') {
                return valor;
              }

              return encodeURI(baseMateriales + valor);
            }

            function configurarBotonArchivo(selector, archivo) {
              var $btn = $(selector);
              var url = normalizarRutaArchivo(archivo);

              if (url) {
                $btn.attr('href', url).attr('target', '_blank').show();
              } else {
                $btn.attr('disabled', true).show();
              }
            }

            function iconoModalidad(modalidad) {
              var txt = String(modalidad || '').toLowerCase();

              if (txt.indexOf('virtual') !== -1) return 'glyphicon-headphones';
              if (txt.indexOf('presencial') !== -1) return 'glyphicon-user';
              return 'glyphicon-map-marker';
            }

            function renderDetalle(item) {
              if (!item) {
                $('#titulo').text('Sesión no encontrada');
                $('#descripcion').text('No existe una sesión con el id solicitado.');
                $('#posterSesion').hide();
                $('#btnOrdenDia, #btnPresentacion, #btnActa, #btnMinuta, #btnCompartir').hide();
                return;
              }

              $('#titulo').text(item.titulo || 'Sin título');
              $('#descripcion').text(item.descripcion || item.descripcion_corta || 'Sin descripción');
              $('#fecha').text(item.fecha || '');
              $('#modalidad').text(item.modalidad || '');

              $('#iconModalidad')
                .removeClass('glyphicon-headphones glyphicon-user glyphicon-map-marker')
                .addClass(iconoModalidad(item.modalidad));

              if (item.file_poster) {
                $('#posterSesion').attr('src', item.file_poster).attr('alt', item.titulo || 'Sesión');
              } else {
                $('#posterSesion').hide();
              }

              configurarBotonArchivo('#btnOrdenDia', item.file_ordenDia);
              configurarBotonArchivo('#btnPresentacion', item.file_presentacion);
              configurarBotonArchivo('#btnActa', item.file_acta);
              configurarBotonArchivo('#btnMinuta', item.file_minuta);

              $('#btnCompartir').off('click').on('click', function () {
                var shareData = {
                  title: item.titulo || 'Sesión',
                  text: item.descripcion_corta || item.descripcion || 'Te comparto esta sesión',
                  url: window.location.href
                };

                if (navigator.share) {
                  navigator.share(shareData).catch(function (error) {
                    console.log('Error al compartir:', error);
                  });
                } else {
                  navigator.clipboard.writeText(window.location.href).then(function () {
                    alert('Enlace copiado al portapapeles');
                  }).catch(function () {
                    prompt('Copia este enlace:', window.location.href);
                  });
                }
              });
            }

            function obtenerIdsRelacionados(relacionadosStr) {
              if (!relacionadosStr) return [];

              return String(relacionadosStr)
                .split(',')
                .map(function (id) { return id.trim(); })
                .filter(function (id) { return id !== ''; });
            }

            function renderRelacionados(itemActual) {
              var container = $('#relacionadosContainer');
              container.empty();

              if (!itemActual || !itemActual.relacionados) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados.</div>');
                return;
              }

              var idsRelacionados = obtenerIdsRelacionados(itemActual.relacionados);

              var relacionados = idsRelacionados
                .map(function (idRel) {
                  return buscarItemPorId(idRel);
                })
                .filter(function (item) {
                  return item && String(item.id) !== String(itemActual.id);
                })
                .slice(0, 2);

              if (relacionados.length === 0) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados para esta sesión.</div>');
                return;
              }

              $.each(relacionados, function (_, item) {
                var html = `
                  <div class="col-xs-12 col-md-6">
                    <div class="card-relacionado">
                      <div class="fecha-relacionado">
                        <span class="glyphicon glyphicon-calendar"></span>
                        ${item.fecha || ''}
                      </div>

                      <h3 class="titulo-card-rel">${item.titulo || ''}</h3>

                      <p class="desc-card-rel">${item.descripcion_corta || item.descripcion || ''}</p>

                      <div class="text-right">
                        <a href="SINBANEM-SesionesDetalle.html?id=${item.id}" class="btn btn-ver-rel">
                          Ver sesión <i class="glyphicon glyphicon-chevron-right" style="margin-left:5px;"></i>
                        </a>
                      </div>
                    </div>
                  </div>
                `;

                container.append(html);
              });
            }

            var id = obtenerIdURL();

            if (!id) {
              $('#titulo').text('Sesión no encontrada');
              $('#descripcion').text('No se recibió un identificador en la URL.');
              $('#posterSesion').hide();
              $('#btnOrdenDia, #btnPresentacion, #btnActa, #btnMinuta, #btnCompartir').hide();
              $('#relacionadosContainer').html('<div class="col-xs-12 text-center">No hay relacionados.</div>');
              return;
            }

            var itemActual = buscarItemPorId(id);

            renderDetalle(itemActual);
            renderRelacionados(itemActual);

          });

        </script>
        </body>
