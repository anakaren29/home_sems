            function parseFecha(raw) {
                // formatos a convertir  "10/1/25" o "15/10/2025"
                if (!raw) return null;
                const parts = raw.split("/");
                if (parts.length !== 3) return null;

                let [d, m, y] = parts.map(p => p.trim());
                let year = Number(y);

                if (String(y).length === 2) {

                    year = (year <= 69) ? (2000 + year) : (1900 + year);
                }
                const day = Number(d);
                const month = Number(m) - 1;

                const dt = new Date(year, month, day);
                return isNaN(dt.getTime()) ? null : dt;
            }

            function formatFecha(dt) {
                if (!dt) return "";
                const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                return `${dt.getDate()} de ${meses[dt.getMonth()]} de ${dt.getFullYear()}`;
            }

            function escapeHtml(str) {
                return String(str ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function getImgByNumero(n) {
                return `assets/comunidad-estudiantil/not${n}.png`;
            }


            function renderPage(page) {
                const totalItems = noticiasData.length;
                const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
                currentPage = Math.min(Math.max(1, page), totalPages);

                const start = (currentPage - 1) * pageSize;
                const end = start + pageSize;
                const slice = noticiasData.slice(start, end);

                // Pinta tarjetas
                   $list.innerHTML = "";

                for (let i = 0; i < slice.length; i += 2) {
                    const row = document.createElement("div");
                    row.className = "row";

                    slice.slice(i, i + 2).forEach(item => {
                        const numero = item["Número de noticia"]?.trim() || "";
                        const titulo = item["TÍTULO "]?.trim() || "";
                        const resumen = item["RESUMEN "]?.trim() || "";
                        const link = item["LINK PARA REDIRECCIÓN "]?.trim() || "#";
                        const fechaRaw = item["FECHA PUBLICACIÓN ESCUELA"]?.trim() || "";
                        const fecha = formatFecha(parseFecha(fechaRaw));
                        //const imgSrc = `assets/comunidad-estudiantil/not${numero}.png`;
                        const imgSrc = 'assets/comunidad-estudiantil/not1.png';

                        const col = document.createElement("div");
                        col.className = "col-xs-12 col-sm-6";
                        col.innerHTML = `
                            <article class="bn-card2">
                                <div class="bn-card2-inner">

                                <div class="bn-card2-thumb">
                                    <img src="${imgSrc}" alt="${titulo}" class="img-responsive">
                                </div>

                                <div class="bn-card2-body">
                                    <h3 class="bn-card2-title">${titulo}</h3>
                                    <div class="bn-card2-line"></div>
                                    <div class="bn-card2-date">${fecha}</div>
                                    <p class="text-noticias">${resumen}</p>
                                    <a href="${link}" target="_blank" class="btn-noticias-m">
                                    Leer más <span class="glyphicon glyphicon-chevron-right"></span>
                                    </a>
                                </div>

                                </div>
                            </article>
                            `;

                        row.appendChild(col);
                    });

                    $list.appendChild(row);
                }

                renderPager(totalPages);
                scrollToListTop();
            }

            function renderPager(totalPages) {
                // Paginador 
                const prevDisabled = currentPage === 1 ? "disabled" : "";
                const nextDisabled = currentPage === totalPages ? "disabled" : "";

                let pagesHtml = "";
                for (let p = 1; p <= totalPages; p++) {
                    const active = p === currentPage ? "active" : "";
                    pagesHtml += `
                    <li class="${active}">
                        <a href="javascript:void(0)" data-page="${p}">${p}</a>
                    </li>
                    `;
                                }

                                $pager.innerHTML = `
                    <li class="${prevDisabled}">
                    <a href="javascript:void(0)" data-page="${currentPage - 1}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                    </li>
                    ${pagesHtml}
                    <li class="${nextDisabled}">
                    <a href="javascript:void(0)" data-page="${currentPage + 1}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                    </li>
                `;

                $pager.onclick = (e) => {
                    const a = e.target.closest("a[data-page]");
                    if (!a) return;

                    const li = a.parentElement;
                    if (li.classList.contains("disabled") || li.classList.contains("active")) return;

                    const page = Number(a.getAttribute("data-page"));
                    if (!Number.isFinite(page)) return;

                    renderPage(page);
                };
            }

            function scrollToListTop() {

                $list.scrollIntoView({ behavior: "smooth", block: "start" });
            }

            renderPage(1);

    </script>
  </body>
</html>
