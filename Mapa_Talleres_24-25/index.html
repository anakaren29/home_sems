    <style>
        :root {
            --color-primario: #691C32;
            --color-secundario: #8a2442;
            --color-fondo: #ffffff;
            --color-texto: #333;
            --color-borde: #ddd;
            --sombra: 0 0 15px rgba(0,0,0,0.2);
        }
        
        body {
            padding: 0;
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.6;
        }
        
        html, body, #map {
            height: 91%;
            width: 100%;
        }
        
        #panel {
            display: flex;
            justify-content: left;
            align-items: center;
            margin-left: 15px;
            background-color: var(--color-fondo);
            margin-top: 0;
            margin-bottom: 0;
            padding: 8px 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .info {
            padding: 6px 8px;
            background: rgba(255,255,255,0.9);
            box-shadow: var(--sombra);
            border-radius: 5px;
        }
        
        .legend {
            line-height: 18px;
            color: #555;
        }
        
        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
            border-radius: 50%;
            border: 1px solid #fff;
        }
        
        .titulo {
            margin: 1px 0;
            padding: 0;
            line-height: 1.2;
            text-align: center;
        }
        
        .img {
            margin-left: 10px;
            margin-bottom: -28px;
        }
        
        .footer {
            margin-top: 5px;
        }
        
        select {
            padding: 5px;
            border: 1px solid var(--color-primario);
            border-radius: 4px;
            font-family: 'Noto Sans', sans-serif;
            min-width: 200px;
            background-color: white;
        }
        
        select:disabled {
            background-color: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }
        
        select option:disabled {
            color: #999;
            background-color: #f5f5f5;
        }
        
        button {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--color-primario);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover, button:focus {
            background-color: var(--color-secundario);
            outline: none;
        }
        
        .btn-excel {
            background-color: #1e5b4f !important;
            color: white !important;
        }
        
        .btn-excel:hover, .btn-excel:focus {
            background-color: #2a7c6e !important;
        }
        
        .info-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 10000;
            max-width: 80%;
            max-height: 80vh;
            overflow: auto;
            display: none;
        }
        
        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--color-borde);
            padding-bottom: 10px;
        }
        
        .overlay-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--color-primario);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-primario);
            padding: 0 5px;
        }
        
        .overlay-content {
            line-height: 1.6;
        }
        
        .overlay-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            display: none;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        table td {
            padding: 3px 5px;
            vertical-align: top;
        }
        
        @media (max-width: 768px) {

                align-items: flex-start;
                margin-left: 5px;
                gap: 8px;

            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            background-color: #ffebee;
            color: #c62828;
            z-index: 10000;
            text-align: center;
            display: none;

        .leaflet-marker-icon:focus, 
        .leaflet-marker-icon:active, 
        .leaflet-marker-icon:focus-visible {
            outline: none !important;
            box-shadow: none !important;
        }

        /* Estilo para el icono de PODEBIS con fondo blanco */
        .podebis-record-circle {
            color: #a57f2c; /* Color dorado */
            font-size: 20px; /* Tamaño más pequeño */
            background-color: white; /* Fondo blanco para el interior del círculo */
            border-radius: 50%; /* Hacer el fondo circular */
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); /* Sombra blanca */
            transition: all 0.3s ease;
        }

        /* Efecto de parpadeo para PODEBIS */
        .blinking {
            animation: blink 4s infinite;
        }

        .legend-podebis-svg {
            width: 14px;
            height: 14px;
            margin-right: 8px;
            border-radius: 50%;
            background: white;
            border: 2px solid #a57f2c;
            position: relative;
        }

        .legend-podebis-svg::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #a57f2c;
            border-radius: 50%;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }

            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #333;

            align-items: center;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #555;

            height: 14px;
            margin-right: 8px;
            border-radius: 50%;

        .legend-bachillerato-tecnologico {

            border: 1px solid #FFFFFF;
        }

        .legend-podebis {
            background: #FFFFFF;
            border: 1px solid #a57f2c;
        }

        .legend-podebis-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #a57f2c;
            border-radius: 50%;
            border: 1px solid #a57f2c;
        }
        
        /* Leyenda para el icono PODEBIS */
        .legend-record-circle {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #555;

        .legend-record-circle-icon {
            margin-right: 8px;
            color: #a57f2c;
            font-size: 16px;
            background-color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Estilos para el botón de exportación */
        .export-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>

            estadosBboxes: {

                "Baja California": [[28.0000, -117.5000], [32.7188, -112.5000]],
                "Baja California Sur": [[22.8644, -112.5000], [28.0000, -109.0000]],
                "Campeche": [[17.4500, -92.5000], [21.1887, -89.0075]],

                "Chihuahua": [[25.5000, -109.5000], [31.5000, -103.0000]],

                "Coahuila de Zaragoza": [[24.9309, -103.8191], [29.5000, -99.5000]],
                "Colima": [[18.6836, -104.7016], [19.5000, -103.5000]],
                "Durango": [[22.3744, -106.9199], [26.8508, -102.5424]],
                "Guanajuato": [[19.9879, -102.0272], [21.8690, -99.7852]],
                "Guerrero": [[16.0000, -102.0000], [19.0000, -97.5000]],
                "Hidalgo": [[19.5000, -99.5000], [21.5000, -97.5000]],
                "Jalisco": [[18.5000, -105.5000], [22.5000, -101.5000]],
                "México": [[18.0000, -100.5000], [20.5000, -98.5000]],
                "Michoacán de Ocampo": [[17.5000, -103.5000], [20.5000, -100.0000]],
                "Morelos": [[18.0000, -99.5000], [19.5000, -98.5000]],
                "Nayarit": [[20.5000, -105.5000], [23.0000, -103.5000]],
                "Nuevo León": [[23.5000, -101.0000], [27.5000, -98.5000]],

                "Querétaro": [[19.9838, -100.5261], [21.7031, -99.0928]],
                "Quintana Roo": [[17.9247, -89.2722], [21.6134, -86.6493]],
                "San Luis Potosí": [[21.0000, -102.5000], [24.5000, -98.5000]],
                "Sinaloa": [[22.1823, -108.8329], [26.9376, -105.6067]],
                "Sonora": [[26.0000, -115.0000], [32.5000, -108.5000]],
                "Tabasco": [[17.0000, -94.0000], [19.0000, -90.5000]],
                "Tamaulipas": [[22.0000, -99.5000], [27.5000, -96.5000]],
                "Tlaxcala": [[19.0351, -98.5616], [19.7284, -97.5418]],
                "Veracruz de Ignacio de la Llave": [[17.2691, -98.2507], [22.3614, -93.5670]],
                "Yucatán": [[19.5129, -90.3824], [21.5563, -87.4755]],

            }
        };

        // Variables globales
        let map;
        let mun;
        let plantelesLayer;
        let podebisLayer;
        let municipiosResaltadosEntidad = null;
        let searchControl;
        let carrerasUnicas = new Set();
        let sectoresUnicos = new Set();
        let blinkingInterval;

        // Orden personalizado para sectores - CORREGIDO
        const ordenSectores = [
            "Aeroespacial",
            "Agroindustria",
            "Automotriz y electromovilidad",
            "Bienes de consumo",
            "Economía circular",
            "Electrónica y semiconductores",
            "Energía",
            "Energías limpias",
            "Farmacéutica y dispositivos médicos",
            "Industria del plástico",
            "Industrias metálicas básicas",
            "Logística",
            "Metalmecánica",
            "Química y petroquímica",
            "Textil y calzado",
            "Industria cultural",
            "Industrial",
            "Salud y cuidados",
            "Turismo",
            "TIC"
        ];

        // Función para formatear números con separador de miles
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Función para generar contenido base de popup
        function generarPopupBase(feature) {
            return `
                <div style="text-align:center">
                    <h4>${feature.properties.CCT}</h4>
                    <h3>${feature.properties.Subsistema}</h3>
                </div>
                <hr>
                <table>
                    <tr><td style="text-align:left"><b>Entidad federativa: </b>${feature.properties.Entidad}</td></tr>
                    <tr><td style="text-align:left"><b>Municipio: </b>${feature.properties.Municipio}</td></tr>
                    <tr><td style="text-align:left"><b>Nombre: </b>${feature.properties.Nombre}</td></tr>
                    <tr><td style="text-align:left"><b>Carrera técnica: </b>${feature.properties.Carrera}</td></tr>
                    <tr><td style="text-align:left"><b>Tipo de sector: </b>${feature.properties.Tipo_sec}</td></tr>
                    <tr><td style="text-align:left"><b>Nombre del sector: </b>${feature.properties.Sector}</td></tr>
                    <tr><td style="text-align:left"><b>Matrícula de la carrera/formación laboral: </b>${feature.properties.Mat_carr}</td></tr>
                    <tr><td style="text-align:left"><b>Matrícula total del plantel: </b>${feature.properties.Matr_total}</td></tr>
                </table>
                <hr>`;
        }

        // Función optimizada para hacer zoom a una entidad
        function zoomAEntidad(entidadSeleccionada) {
            if (entidadSeleccionada === "Todos") {
                map.flyTo(config.zoomNacional.center, config.zoomNacional.zoom, {
                    duration: 0.5
                });
                return;
            }
            
            const bounds = config.estadosBboxes[entidadSeleccionada];
            
            if (bounds) {
                const leafletBounds = new L.LatLngBounds(
                    new L.LatLng(bounds[0][0], bounds[0][1]),
                    new L.LatLng(bounds[1][0], bounds[1][1])
                );
                
                map.flyToBounds(leafletBounds, {
                    padding: [50, 50],
                    duration: 0.5,
                    maxZoom: 10
                });
            }
        }

        // Función para cerrar el overlay
        function closeInfoOverlay() {
            document.getElementById('overlayBackdrop').style.display = 'none';
            document.getElementById('infoOverlay').style.display = 'none';
            document.getElementById('Entidad').focus();
        }

        // Función para filtrar planteles según selección
        function filtrarPlanteles() {
            const entidadSeleccionada = document.getElementById("Entidad").value;
            const carreraSeleccionada = document.getElementById("Carrera").value;
            const sectorSeleccionado = document.getElementById("Sector").value;
            
            const plantelesFiltrados = Planteles_carreras.features.filter(function(feature) {
                const cumpleEntidad = (entidadSeleccionada === "Todos" || feature.properties.Entidad === entidadSeleccionada);
                const cumpleCarrera = (carreraSeleccionada === "Todos" || feature.properties.Carrera === carreraSeleccionada);
                const cumpleSector = (sectorSeleccionado === "Todos" || feature.properties.Sector === sectorSeleccionado);
                return cumpleEntidad && cumpleCarrera && cumpleSector;
            });
            
            plantelesLayer.clearLayers();
            
            if (plantelesFiltrados.length > 0) {
                plantelesLayer.addData(plantelesFiltrados);
            }
            
            // Asegurar que PODEBIS esté siempre encima
            if (podebisLayer) {
                map.removeLayer(podebisLayer);
                map.addLayer(podebisLayer);
            }
            
            searchControl.setLayer(plantelesLayer);
            
            // Actualizar el botón de limpiar
            actualizarBotonLimpiar();
        }

        // Función para resaltar municipios por entidad
        function resaltarMunicipiosPorEntidad() {
            const entidadSeleccionada = document.getElementById("Entidad").value;
            
            if (municipiosResaltadosEntidad) {
                map.removeLayer(municipiosResaltadosEntidad);
            }
            
            if (entidadSeleccionada === "Todos") {
                return;
            }
            
            municipiosResaltadosEntidad = L.geoJSON(nvomun, {
                pane: 'municipiosResaltados',
                style: function(feature) {
                    return {
                        fillColor: feature.properties.Entidad === entidadSeleccionada ? '#98989a' : '#D3D3D3',
                        weight: feature.properties.Entidad === entidadSeleccionada ? 1.5 : 0.8,
                        opacity: feature.properties.Entidad === entidadSeleccionada ? 1 : 0.4,
                        color: feature.properties.Entidad === entidadSeleccionada ? '#5e5e5e' : '#6F7271',
                        dashArray: '0',
                        fillOpacity: feature.properties.Entidad === entidadSeleccionada ? 0.7 : 0.6
                    };
                },
                onEachFeature: popupMunicipio
            }).addTo(map);
        }

        // Función para verificar selección activa
        function haySeleccionActiva() {
            const entidad = document.getElementById("Entidad").value;
            const carrera = document.getElementById("Carrera").value;
            const sector = document.getElementById("Sector").value;
            return entidad !== "Todos" || carrera !== "Todos" || sector !== "Todos";
        }

        // Función para actualizar el botón de limpiar
        function actualizarBotonLimpiar() {
            const limpiarBtn = document.getElementById("limpiarBtn");
            limpiarBtn.style.display = haySeleccionActiva() ? "inline-block" : "none";
        }

        // Función para obtener planteles filtrados actuales
        function obtenerPlantelesFiltrados() {
            const entidadSeleccionada = document.getElementById("Entidad").value;
            const carreraSeleccionada = document.getElementById("Carrera").value;
            const sectorSeleccionado = document.getElementById("Sector").value;
            
            return Planteles_carreras.features.filter(function(feature) {
                const cumpleEntidad = (entidadSeleccionada === "Todos" || feature.properties.Entidad === entidadSeleccionada);
                const cumpleCarrera = (carreraSeleccionada === "Todos" || feature.properties.Carrera === carreraSeleccionada);
                const cumpleSector = (sectorSeleccionado === "Todos" || feature.properties.Sector === sectorSeleccionado);
                return cumpleEntidad && cumpleCarrera && cumpleSector;
            });
        }

        // Función para limpiar todas las selecciones
        function limpiarSeleccion() {
            document.getElementById("Entidad").value = "Todos";
            document.getElementById("Carrera").value = "Todos";
            document.getElementById("Sector").value = "Todos";
            
            // Habilitar todas las opciones de entidad
            const entidadSelect = document.getElementById("Entidad");
            Array.from(entidadSelect.options).forEach(option => {
                option.disabled = false;
            });
            
            // Llenar carreras y sectores con todas las opciones disponibles
            actualizarSelectoresCompletamente();
            
            // Aplicar filtros
            filtrarPlanteles();
            resaltarMunicipiosPorEntidad();
            zoomAEntidad("Todos");
            
            document.getElementById("limpiarBtn").style.display = "none";
        }

        // Función para obtener combinaciones disponibles entre selectores
        function obtenerCombinacionesDisponibles() {
            const entidadActual = document.getElementById("Entidad").value;
            const carreraActual = document.getElementById("Carrera").value;
            const sectorActual = document.getElementById("Sector").value;
            
            const combinaciones = {
                entidades: new Set(),
                carreras: new Set(),
                sectores: new Set()
            };
            
            Planteles_carreras.features.forEach(function(feature) {
                const entidad = feature.properties.Entidad;
                const carrera = feature.properties.Carrera;
                const sector = feature.properties.Sector ? feature.properties.Sector.trim() : "";
                
                // Filtrar según las selecciones actuales
                let cumple = true;
                
                if (entidadActual !== "Todos" && entidad !== entidadActual) {
                    cumple = false;
                }
                if (carreraActual !== "Todos" && carrera !== carreraActual) {
                    cumple = false;
                }
                if (sectorActual !== "Todos" && sector !== sectorActual) {
                    cumple = false;
                }
                
                if (cumple) {
                    // Agregar todas las entidades que tienen la combinación actual
                    if (entidad) combinaciones.entidades.add(entidad);
                    // Agregar todas las carreras que tienen la combinación actual
                    if (carrera) combinaciones.carreras.add(carrera);
                    // Agregar todos los sectores que tienen la combinación actual
                    if (sector) combinaciones.sectores.add(sector);
                }
            });
            
            return combinaciones;
        }

        // Función para actualizar los selectores de manera interoperante - CORREGIDA
        function actualizarSelectoresCompletamente() {
            const combinaciones = obtenerCombinacionesDisponibles();
            
            const entidadActual = document.getElementById("Entidad").value;
            const carreraActual = document.getElementById("Carrera").value;
            const sectorActual = document.getElementById("Sector").value;
            
            // 1. Actualizar selector de entidades
            const entidadSelect = document.getElementById("Entidad");
            Array.from(entidadSelect.options).forEach(option => {
                if (option.value === "Todos") {
                    option.disabled = false;
                } else {
                    // Deshabilitar entidades que no tienen la combinación carrera-sector seleccionada
                    if (carreraActual !== "Todos" || sectorActual !== "Todos") {
                        option.disabled = !combinaciones.entidades.has(option.value);
                    } else {
                        option.disabled = false;
                    }
                }
            });
            
            // Si la entidad actual está deshabilitada, resetear a "Todos"
            if (entidadActual !== "Todos") {
                const opcionActual = Array.from(entidadSelect.options).find(opt => opt.value === entidadActual);
                if (opcionActual && opcionActual.disabled) {
                    entidadSelect.value = "Todos";
                }
            }
            
            // 2. Actualizar selector de carreras
            const carreraSelect = document.getElementById("Carrera");
            carreraSelect.innerHTML = '<option value="Todos">Todas las carreras técnicas</option>';
            
            // Obtener carreras disponibles según combinación actual
            const carrerasDisponibles = Array.from(combinaciones.carreras);
            carrerasDisponibles.sort().forEach(function(carrera) {
                const option = document.createElement("option");
                option.value = carrera;
                option.textContent = carrera;
                carreraSelect.appendChild(option);
            });
            
            // Si la carrera actual no está disponible, resetear a "Todos"
            if (carreraActual !== "Todos" && !carrerasDisponibles.includes(carreraActual)) {
                carreraSelect.value = "Todos";
            } else {
                carreraSelect.value = carreraActual;
            }
            
            // 3. Actualizar selector de sectores
            const sectorSelect = document.getElementById("Sector");
            sectorSelect.innerHTML = '<option value="Todos">Todos los sectores</option>';
            
            // Obtener sectores disponibles según combinación actual
            const sectoresDisponibles = Array.from(combinaciones.sectores);
            
            // Ordenar sectores según orden personalizado
            const sectoresOrdenados = sectoresDisponibles.sort((a, b) => {
                const indexA = ordenSectores.indexOf(a);
                const indexB = ordenSectores.indexOf(b);
                
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return a.localeCompare(b);
            });
            
            sectoresOrdenados.forEach(function(sector) {
                const option = document.createElement("option");
                option.value = sector;
                option.textContent = sector;
                sectorSelect.appendChild(option);
            });
            
            // Si el sector actual no está disponible, resetear a "Todos"
            if (sectorActual !== "Todos" && !sectoresOrdenados.includes(sectorActual)) {
                sectorSelect.value = "Todos";
            } else {
                sectorSelect.value = sectorActual;
            }
        }

        // Función para inicializar los selectores al cargar
        function inicializarSelectores() {
            // Obtener todas las carreras y sectores únicos
            const carrerasSet = new Set();
            const sectoresSet = new Set();
            
            Planteles_carreras.features.forEach(function(feature) {
                if (feature.properties.Carrera) carrerasSet.add(feature.properties.Carrera);
                if (feature.properties.Sector) sectoresSet.add(feature.properties.Sector.trim());
            });
            
            // Llenar selector de carreras
            const carreraSelect = document.getElementById("Carrera");
            const carrerasOrdenadas = Array.from(carrerasSet).sort();
            carrerasOrdenadas.forEach(function(carrera) {
                const option = document.createElement("option");
                option.value = carrera;
                option.textContent = carrera;
                carreraSelect.appendChild(option);
            });
            
            // Llenar selector de sectores
            const sectorSelect = document.getElementById("Sector");
            const sectoresOrdenados = Array.from(sectoresSet).sort((a, b) => {
                const indexA = ordenSectores.indexOf(a);
                const indexB = ordenSectores.indexOf(b);
                
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return a.localeCompare(b);
            });
            
            sectoresOrdenados.forEach(function(sector) {
                const option = document.createElement("option");
                option.value = sector;
                option.textContent = sector;
                sectorSelect.appendChild(option);
            });
        }

        // Función para popup de municipios
        function popupMunicipio(feature, layer) {
            if (feature.properties && feature.properties.NOMGEO) {
                // Formatear los números con separador de miles
                const conEMSsigue = formatNumber(feature.properties.Con_EMS_sigue);
                const conEMSNoSigue = formatNumber(feature.properties.Con_EMS_NoSigue);
                const pobTot25 = formatNumber(feature.properties.PobTot25);
                const pob1519 = formatNumber(feature.properties.Pob_15_19);
                
                layer.bindPopup(

                        <tr><td><b>Grado de marginación: </b>${feature.properties.GM_2020}</td></tr>
                        <tr><td><b>Población total: </b>${pobTot25}</td></tr>

        // Estilo para planteles
        function estiloPlanteles(feature) {
            return {
                radius: 6,
                fillColor: colorPuntos(feature.properties.Subsistema),
                color: "#FFFFFF",
                weight: 0.5,
                opacity: 1,

            };
        }

        // Función para crear marcadores PODEBIS con icono record-circle
        function createPodebisMarker(feature, latlng) {
            // Crear el icono record-circle de Bootstrap
            const recordCircleIcon = L.divIcon({
                className: 'podebis-record-circle blinking',
                html: '<i class="bi bi-record-circle"></i>',
                iconSize: [20, 20], // Tamaño más pequeño
                iconAnchor: [10, 10],
                popupAnchor: [0, -10]
            });
            
            return L.marker(latlng, { icon: recordCircleIcon });
        }

        // Función para manejar eventos de mouse en puntos PODEBIS
        function onEachPodebisFeature(feature, layer) {
            // Tooltip con la propiedad descriptio
            layer.bindTooltip(feature.properties.descriptio, {
                permanent: false,
                direction: 'top',
                className: 'podebis-tooltip'
            });

            // Eventos para el efecto de resaltado
            layer.on('mouseover', function() {
                // Cambiar estilo para resaltar - hacer el icono más grande
                const iconElement = layer.getElement();
                if (iconElement) {
                    iconElement.style.fontSize = '24px';
                    iconElement.style.filter = 'drop-shadow(0 0 4px rgba(255, 255, 255, 0.9))'; // Sombra blanca
                }
            });

            layer.on('mouseout', function() {
                // Restaurar estilo original
                const iconElement = layer.getElement();
                if (iconElement) {
                    iconElement.style.fontSize = '20px';
                    iconElement.style.filter = 'drop-shadow(0 0 2px rgba(255, 255, 255, 0.7))'; // Sombra blanca
                }
            });

            // Popup para PODEBIS
            if (feature.properties) {
                let popupContent = `<div style="text-align:center"><h3>${feature.properties.descriptio || 'Polo de Desarrollo'}</h3></div>`;
                
                if (feature.properties.entidad) {
                    popupContent += `<p><b>Entidad:</b> ${feature.properties.entidad}</p>`;
                }
                
                if (feature.properties.municipio) {
                    popupContent += `<p><b>Municipio:</b> ${feature.properties.municipio}</p>`;
                }
                
                if (feature.properties.descripcion) {
                    popupContent += `<p><b>Descripción:</b> ${feature.properties.descripcion}</p>`;
                }
            }
        }

        // Función para color de puntos
        function colorPuntos(d) {
            const colores = {
                "DGETAyCM": '#1e5b4f',
                "DGETI": '#1e5b4f',
                "BTED": '#1e5b4f',
                "CETI": '#1e5b4f',
                "CECyTE": '#1e5b4f',
                "CONALEP (CDMX-OAX)": '#1e5b4f',
                "CONALEP (Estados)": '#1e5b4f',
            };
            return colores[d] || '#000000';
        }

        // Popup para planteles con oferta educativa
        function popupPlanteles(feature, layer) {
            const baseContent = generarPopupBase(feature);
            
            const content = baseContent + `
                <table>
                    <tr><td style="text-align:left"><b>Oferta educativa adicional (matrícula): </b>${feature.properties.Otros || 'No disponible'}</td></tr>
                </table>`;
            
            layer.bindPopup(content, {minWidth: 250, maxWidth: 300});
        }

        // FUNCIÓN PARA EXPORTAR A EXCEL
        function exportarAExcel() {
            try {
                const plantelesFiltrados = obtenerPlantelesFiltrados();
                
                if (plantelesFiltrados.length === 0) {
                    alert("No hay datos para exportar. Por favor, ajuste los filtros para seleccionar algunos registros.");
                    return;
                }
                
                // Crear array de datos excluyendo Latitud y Longitud
                const datosExcel = plantelesFiltrados.map(feature => {
                    const props = feature.properties;
                    return {
                        'CCT': props.CCT || '',
                        'Subsistema': props.Subsistema || '',
                        'Entidad': props.Entidad || '',
                        'Municipio': props.Municipio || '',
                        'Nombre': props.Nombre || '',
                        'Carrera': props.Carrera || '',
                        'Tipo de sector': props.Tipo_sec || '',
                        'Sector': props.Sector || '',
                        'Matrícula carrera': props.Mat_carr || '',
                        'Matrícula total': props.Matr_total || '',
                        'Oferta educativa adicional': props.Otros || ''
                    };
                });
                
                // Crear hoja de cálculo
                const ws = XLSX.utils.json_to_sheet(datosExcel);
                
                // Ajustar anchos de columnas
                const wscols = [
                    {wch: 15}, // CCT
                    {wch: 20}, // Subsistema
                    {wch: 20}, // Entidad
                    {wch: 25}, // Municipio
                    {wch: 40}, // Nombre
                    {wch: 50}, // Carrera
                    {wch: 20}, // Tipo de sector
                    {wch: 25}, // Sector
                    {wch: 18}, // Matrícula carrera
                    {wch: 18}, // Matrícula total
                    {wch: 30}  // Oferta educativa adicional
                ];
                ws['!cols'] = wscols;
                
                // Crear libro de trabajo
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Planteles");
                
                // Generar nombre de archivo con fecha
                const fecha = new Date();
                const fechaStr = fecha.toISOString().split('T')[0];
                const horaStr = fecha.getHours().toString().padStart(2, '0') + 
                               fecha.getMinutes().toString().padStart(2, '0');
                
                const nombreArchivo = `Planteles_Bachillerato_${fechaStr}_${horaStr}.xlsx`;
                
                // Descargar archivo
                XLSX.writeFile(wb, nombreArchivo);
                
                console.log(`Exportados ${plantelesFiltrados.length} registros a Excel`);
                
            } catch (error) {
                console.error("Error al exportar a Excel:", error);
                alert("Ocurrió un error al exportar los datos. Por favor, intente nuevamente.");
            }
        }

        function inicializarMapa() {
            map = L.map('map', {
                center: config.zoomNacional.center,

                zoomSnap: 0.25,
                zoomDelta: 0.25,
                wheelPxPerZoomLevel: 60,
                maxBounds: config.maxBounds,
                zoomControl: false,
                inertia: true,
                inertiaDeceleration: 3000
            });

            L.control.zoom({
                zoomInTitle: 'Acercar',
                zoomOutTitle: 'Alejar',
                zoomInText: '+',
                zoomOutText: '-',
                zoomDelta: 0.25

            // Crear paneles personalizados
            map.createPane('municipiosResaltados');
            map.getPane('municipiosResaltados').style.zIndex = 350;

            }).show();

                position: "topleft",
                title: "Restaurar vista",
                latlng: L.latLng(config.zoomNacional.center),
                zoom: config.zoomNacional.zoom,
            }).addTo(map);
        }

        function inicializarCapas() {
            try {
                mun = L.geoJSON(nvomun, {
                    style: function() {
                        return {
                            fillColor: '#D3D3D3',
                            weight: 0.8,
                            opacity: 0.4,
                            color: '#6F7271',
                            dashArray: '0',
                            fillOpacity: 0.6
                        };
                    },
                    pane: 'tilePane', 
                    onEachFeature: popupMunicipio
                }).addTo(map);

                plantelesLayer = L.geoJSON(Planteles_carreras, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng);
                    },
                    pane: 'overlayPane',
                    style: estiloPlanteles,
                    onEachFeature: popupPlanteles
                }).bindTooltip(function (layer) {
                    return layer.feature.properties.Subsistema;
                });

                // Capa PODEBIS con panel personalizado

                map.addLayer(podebisLayer);

        // Inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', function() {

                inicializarCapas();
                inicializarControles();
                
                // Inicializar selectores
                inicializarSelectores();
                
                // Configurar event listeners
                document.getElementById('Entidad').addEventListener('change', function() {
                    resaltarMunicipiosPorEntidad();
                    zoomAEntidad(document.getElementById("Entidad").value);
                    actualizarSelectoresCompletamente();
                    filtrarPlanteles();
                    actualizarBotonLimpiar();
                });
                
                document.getElementById('Carrera').addEventListener('change', function() {
                    actualizarSelectoresCompletamente();
                    filtrarPlanteles();
                    actualizarBotonLimpiar();
                });
                
                document.getElementById('Sector').addEventListener('change', function() {
                    actualizarSelectoresCompletamente();
                    filtrarPlanteles();
                    actualizarBotonLimpiar();
                });
                
                document.getElementById('limpiarBtn').addEventListener('click', limpiarSeleccion);
                
                // Event listener para el botón de exportar a Excel
                document.getElementById('exportarExcelBtn').addEventListener('click', exportarAExcel);
                
                document.getElementById('closeOverlayBtn').addEventListener('click', closeInfoOverlay);
                document.getElementById('overlayBackdrop').addEventListener('click', closeInfoOverlay);
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error("Error al inicializar:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMessage').textContent = "Error al cargar el mapa. Por favor recargue la página.";
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        // Deshabilitar clic derecho
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
