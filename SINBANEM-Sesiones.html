        <script>
          $(document).ready(function () {

            
            var jsonData = [
              {
                "id": "1",
                "titulo": "Primera Sesión Extraordinaria 2026",
                "descripcion_corta": "Primera Sesión Extraordinaria2026 del Consejo del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana.",
                "descripcion": "Primera Sesión Extraordinaria de 2026 del Consejo Nacional del SINBANEM. En la sesión se votó el calendario de sesiones ordinarias del 2026 y se mencionaron los temasque serán prioritarios para este año.",
                "fecha": "Viernes 16 de enero de 2026",
                "modalidad": "Virtual",
                "relacionados": "2,3",
                "file_ordenDia": "orden del día-01.pdf",
                "file_presentacion": "Presentación final-01.pptx",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "2",
                "titulo": "Primera Sesión Ordinaria 2026",
                "descripcion_corta": "Primera Sesión Ordinaria 2026del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana",
                "descripcion": "Primera Sesión Ordinaria de 2026.\nEn la Sesión se votó un punto de acuerdo para añadir a los Lineamientos Generales la obligatoriedad de firmar las actas de las sesiones de manera electrónica. \nSe presentaron avances de la Comisión de Trabajo sobre Reglas y Lineamientos de Registro Escolar y Portabilidad de Estudios. \nSe presentó un Informe de Indicadores de cobertura, \nasí como el tema de los Juegos escolares y Política de copas de futbol estudiantil. ",
                "fecha": "Jueves 22 de enero de 2026",
                "modalidad": "Virtual",
                "relacionados": "1,3",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "3",
                "titulo": "Segunda Sesión Extraordinaria 2026",
                "descripcion_corta": "Segunda Sesión Extraordinaria de 2026 del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana.",
                "descripcion": "Segunda Sesión Extraordinaria 2026.En esta sesión se presentó el Informe de avances de los Mecanismos de ingreso a la Educación Media Superior (Acuerdo SINBANEM_04_17/10/25) y se votó un Punto de Acuerdo para la implementación obligatoria de procesos estatales centralizados de registro y asignación a la Educación Media Superior, orientados a garantizar el acceso universal y el ejercicio efectivo del derecho a la educación. ",
                "fecha": "Jueves 29 de enero de 2026",
                "modalidad": "Presencial",
                "relacionados": "1,2",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              },
              {
                "id": "4",
                "titulo": "Segunda Sesión Ordinaria 2026",
                "descripcion_corta": "Segunda Sesión Ordinaria 2026 del Consejo Nacional del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana",
                "descripcion": "",
                "fecha": "Jueves 26 de marzo de 2026",
                "modalidad": "Virtual",
                "relacionados": "",
                "file_ordenDia": "",
                "file_presentacion": "",
                "file_acta": "",
                "file_minuta": "",
                "file_poster": "/assets/SINBANEM/sesiones/poster_sesiones.jpg"
              }
            ];

   
  var currentCategory = 'todos';
  var currentPage = 1;
  var itemsPerPage = 6;
  var filteredData = [];

  // Ejemplo: este arreglo puede venir de tu JSON externo
  // var jsonData = [...];

  function removeAccents(str) {
    return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getYearFromFecha(fecha) {
    var match = String(fecha || '').match(/\b(20\d{2})\b/);
    return match ? match[1] : '';
  }

  function getModalidadIcon(modalidad) {
    var txt = removeAccents(String(modalidad || '').toLowerCase());

    if (txt.indexOf('presencial') !== -1) return 'glyphicon-user';
    if (txt.indexOf('virtual') !== -1) return 'glyphicon-headphones';
    if (txt.indexOf('hibrida') !== -1 || txt.indexOf('híbrida') !== -1) return 'glyphicon-transfer';

    return 'glyphicon-map-marker';
  }

  function updateCounts() {
    $('#count-todos').text(jsonData.length);
    $('#count-2025').text(jsonData.filter(function (item) {
      return getYearFromFecha(item.fecha) === '2025';
    }).length);

    $('#count-2026').text(jsonData.filter(function (item) {
      return getYearFromFecha(item.fecha) === '2026';
    }).length);
  }

  function renderPagination(totalItems) {
    var pagination = $('#paginationContainer');
    pagination.empty();

    var totalPages = Math.ceil(totalItems / itemsPerPage);

    if (totalPages <= 1) return;

    var prevClass = (currentPage === 1) ? 'disabled' : '';
    pagination.append('<li class="' + prevClass + '"><a href="#" data-page="prev">&laquo;</a></li>');

    for (var i = 1; i <= totalPages; i++) {
      var activeClass = (currentPage === i) ? 'active' : '';
      pagination.append('<li class="' + activeClass + '"><a href="#" data-page="' + i + '">' + i + '</a></li>');
    }

    var nextClass = (currentPage === totalPages) ? 'disabled' : '';
    pagination.append('<li class="' + nextClass + '"><a href="#" data-page="next">&raquo;</a></li>');
  }

  function renderResults(data) {
    var container = $('#resultsContainer');
    container.empty();

    if (!data.length) {
      container.append('<div class="col-xs-12 text-center"><h4>No se encontraron sesiones.</h4></div>');
      return;
    }

    $.each(data, function (index, item) {
      var poster = item.file_poster && item.file_poster.trim() !== ''
        ? item.file_poster
        : 'assets/SINBANEM/sesiones/poster-default.jpg';

      var modalidad = item.modalidad || '';
      var modalidadIcon = getModalidadIcon(modalidad);

      var html = `
        <div class="col-sm-6 col-md-4">
          <div class="sesion-card">
            <div class="sesion-img-box">
              <img src="${escapeHtml(poster)}" alt="${escapeHtml(item.titulo)}">
            </div>

            <div class="sesion-body">
              <h3 class="sesion-titulo">${escapeHtml(item.titulo)}</h3>

              <p class="sesion-descripcion-corta">
                ${escapeHtml(item.descripcion_corta || '')}
              </p>

              <p class="sesion-meta">
                <span class="glyphicon glyphicon-calendar"></span>
                <span>${escapeHtml(item.fecha || '')}</span>
              </p>

              <p class="sesion-meta">
                <span class="glyphicon ${modalidadIcon}"></span>
                <span>${escapeHtml(modalidad)}</span>
              </p>

              <button 
                class="btn btn-sesion btn-block btn-abrir-item"
                data-id="${escapeHtml(item.id)}">
                Ver sesión y materiales
                <span class="glyphicon glyphicon-chevron-right"></span>
              </button>
            </div>
          </div>
        </div>
      `;

      container.append(html);
    });
  }

  function processData() {
    var searchTerm = removeAccents($('#searchInput').val().toLowerCase().trim());

    filteredData = jsonData.filter(function (item) {
      var year = getYearFromFecha(item.fecha);
      var matchesCategory = (currentCategory === 'todos') || (String(year) === String(currentCategory));

      var textoBusqueda = removeAccents(
        (
          (item.titulo || '') + ' ' +
          (item.descripcion_corta || '') + ' ' +
          (item.descripcion || '') + ' ' +
          (item.fecha || '') + ' ' +
          (item.modalidad || '')
        ).toLowerCase()
      );

      var matchesSearch = textoBusqueda.indexOf(searchTerm) !== -1;

      return matchesCategory && matchesSearch;
    });

    var totalPages = Math.ceil(filteredData.length / itemsPerPage);

    if (currentPage > totalPages) {
      currentPage = totalPages || 1;
    }

    var startIndex = (currentPage - 1) * itemsPerPage;
    var endIndex = startIndex + itemsPerPage;
    var paginatedData = filteredData.slice(startIndex, endIndex);

    renderResults(paginatedData);
    renderPagination(filteredData.length);
  }

  $('#searchInput').on('keyup', function () {
    currentPage = 1;
    processData();
  });

  $('#searchBtn').on('click', function () {
    currentPage = 1;
    processData();
  });

  $('.filter-btn').on('click', function () {
    $('.filter-btn').removeClass('active');
    $(this).addClass('active');

    currentCategory = $(this).data('filter');
    currentPage = 1;
    processData();
  });

  $('#paginationContainer').on('click', 'a', function (e) {
    e.preventDefault();

    var targetPage = $(this).data('page');
    var totalPages = Math.ceil(filteredData.length / itemsPerPage);

    if (targetPage === 'prev' && currentPage > 1) {
      currentPage--;
    } else if (targetPage === 'next' && currentPage < totalPages) {
      currentPage++;
    } else if (targetPage !== 'prev' && targetPage !== 'next') {
      currentPage = parseInt(targetPage, 10);
    }

    processData();
  });

  $('#resultsContainer').on('click', '.btn-abrir-item', function () {
    var itemId = $(this).data('id');
    window.location.href = '/SINBANEM-SesionesDetalle.html?id=' + itemId;
  });

  updateCounts();
  processData();
});

        </script>
